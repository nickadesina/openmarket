<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-b.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@700&family=Ole:wght@400&family=Sevillana:wght@400&family=Cascadia+Code:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- OpenMarket wordmark, heavy dark grotesque --><p style="font-size:var(--r-wordmark-font);font-family:var(--r-wordmark-family),sans-serif;font-weight:var(--r-wordmark-weight);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav region control" data-region="nav"><!-- MARKETS solid red tab button white caps + PORTFOLIO dark caps link: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-account region control" data-region="account"><!-- john.doe dropdown and PAPER CASH label over red tabular $1,000,000.00: rebuild the control's chrome from the crop (comp-spec.mjs --crop account); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-statstrip region text" data-region="statstrip"><!-- full-width hairline-ruled strip of labeled stats: tiny uppercase labels with tabular figures, red for paper cash, vertical hairline separators --><p style="font-size:var(--r-statstrip-font);line-height:1.05;margin:0">statstrip</p></div>
  <div class="r-board-tab region chrome" data-region="board-tab"><!-- MARKET BOARD small solid red header tab, white caps --></div>
  <div class="r-board-head region text" data-region="board-head"><!-- board column headers row: # COMPANY IMPLIED VALUATION (PAPER) 24H CHANGE 24H SPARKLINE PUBLIC ANCHOR CLAIMS OUTSTANDING STATUS, tiny caps, hairline rules --><p style="font-size:var(--r-board-head-font);font-family:var(--r-board-head-family),sans-serif;font-weight:var(--r-board-head-weight);line-height:1.05;margin:0">board-head</p></div>
  <div class="r-row-anthropic region text" data-region="row-anthropic"><!-- market row: expand chevron glyph, rank 1, small company logo (existing app asset, icon-sized), Anthropic name, red $1.50T tabular figure, up-arrow red change, runtime data sparkline chart, public anchor figure with caption, claims figure, OPEN outlined red badge --><p style="font-size:var(--r-row-anthropic-font);font-family:var(--r-row-anthropic-family),sans-serif;font-weight:var(--r-row-anthropic-weight);line-height:1.05;margin:0">row-anthropic</p></div>
  <div class="r-row-stripe region text" data-region="row-stripe"><!-- market row, expanded state: Stripe, red $59.20B, down change, sparkline, anchor, claims, OPEN badge --><p style="font-size:var(--r-row-stripe-font);line-height:1.05;margin:0">row-stripe</p></div>
  <div class="r-ladder region text" data-region="ladder"><!-- inline expansion: two side-by-side ruled ladder tables, headers VALUATION ABOVE (USD) / YES % / NO %, strike rows with red YES cents figures, one row highlighted with pale red fill --><p style="font-size:var(--r-ladder-font);font-family:var(--r-ladder-family),sans-serif;font-weight:var(--r-ladder-weight);line-height:1.05;margin:0">ladder</p></div>
  <div class="r-board-rest region text" data-region="board-rest"><!-- six more market rows, identical anatomy to row-anthropic: OpenAI, Databricks, Revolut, Klarna, Scale AI, UiPath --><p style="line-height:1.05;margin:0">board-rest</p></div>
  <div class="r-board-foot region text" data-region="board-foot"><!-- board footer rule: 1-8 OF 32 MARKETS centered left, VIEW ALL MARKETS red caps link right --><p style="font-size:var(--r-board-foot-font);line-height:1.05;margin:0">board-foot</p></div>
  <div class="r-activity-tab region chrome" data-region="activity-tab"><!-- LIVE ACTIVITY small solid red header tab, white caps --></div>
  <div class="r-activity-head region text" data-region="activity-head"><!-- activity column headers: TIME USER ACTION DETAILS AMOUNT (PAPER), tiny caps --><p style="font-size:var(--r-activity-head-font);line-height:1.05;margin:0">activity-head</p></div>
  <div class="r-activity-tape region text" data-region="activity-tape"><!-- ruled execution tape, one hairline row per fill: tabular time, username, BOUGHT/SOLD caps, details line, red amount right-aligned --><p style="font-size:var(--r-activity-tape-font);line-height:1.05;margin:0">activity-tape</p></div>
  <div class="r-activity-foot region text" data-region="activity-foot"><!-- VIEW FULL ACTIVITY FEED red caps link centered --><p style="font-size:var(--r-activity-foot-font);line-height:1.05;margin:0">activity-foot</p></div>
  <div class="r-footer region text" data-region="footer"><!-- footer band above hairline: copyright left, PAPER TRADING ONLY. NOT REAL MONEY. NO PURCHASES OR WITHDRAWALS. centered caps, TERMS PRIVACY HELP CONTACT right --><p style="font-size:var(--r-footer-font);line-height:1.05;margin:0">footer</p></div>
</main>
</body>
</html>
