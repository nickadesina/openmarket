name: Settle

# Hourly at :41, clear of the dealer's quarter-hour runs: promote qualifying
# releases to prints, resolve or expire each live instrument in its own
# transaction, pay or void it, and list its successor. X-Run-Id names the
# firing, so re-running a workflow attempt is reported by the route, not
# repeated.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the settle job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}
          SETTLE_URL: ${{ vars.SETTLE_URL || 'https://openmarket.systems/api/cron/settle' }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$REPOSITORY_IS_FORK" != "true" ]; then
              echo "::error::CRON_SECRET is not set; the scheduled job cannot run."
              exit 1
            fi
            echo "::warning::CRON_SECRET is not set; skipping this manual or fork run."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" -H "X-Run-Id: $RUN_ID" "$SETTLE_URL"
