name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede a PR's older runs; every master commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openmarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openmarket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/openmarket_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint, style audit, layer audit
        run: npm run lint && npm run audit:styles && npm run audit:deps

      - name: Run unit and property tests
        run: npm run test:unit

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Build Next.js
        run: npm run build

      - name: Install Playwright Chromium
        if: ${{ hashFiles('playwright.config.*') != '' && hashFiles('tests/browser/**') != '' }}
        run: npm exec -- playwright install --with-deps chromium

      - name: Run Playwright critical flow
        if: ${{ hashFiles('playwright.config.*') != '' && hashFiles('tests/browser/**') != '' }}
        run: npm exec -- playwright test
        env:
          APP_ORIGIN: http://127.0.0.1:3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/openmarket_test
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/openmarket_test

      - name: Verify ledger replay
        # Browser global setup migrates before seeding; integration suites use
        # isolated schemas and do not prepare this public-schema database.
        run: npm run verify:replay
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/openmarket_test

      - name: Upload Playwright report and traces
        if: ${{ always() && hashFiles('playwright.config.*') != '' && hashFiles('tests/browser/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
