name: Backtest

# Reruns the dealer backtest on any change to it or to the code that reads its
# parameters, fails if the committed outputs (params.json included) are not
# what the committed inputs produce, and posts the summary on the PR.
on:
  pull_request:
    paths:
      - "backtest/**"
      - "src/lib/engine/dealer/**"
      - "src/lib/config/dealer.ts"
      - ".github/workflows/backtest.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backtest/requirements.txt

      - name: Install backtest dependencies
        run: pip install -r backtest/requirements.txt

      - name: Run the backtest
        run: python backtest/analyze.py

      - name: Committed outputs match a fresh run
        # Charts are excluded: their bytes depend on the runner's fonts.
        run: |
          if ! git diff --exit-code -- backtest/out ':(exclude)backtest/out/*.png'; then
            echo "::error::backtest/out is stale or hand-edited; run python3 backtest/analyze.py and commit its output."
            exit 1
          fi

      - name: Post the summary on the pull request
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python - > summary.md <<'PY'
          import csv
          rows = list(csv.DictReader(open("backtest/out/summary.csv")))
          cols = ["T_months", "scenario", "group", "settlements", "voids", "void_rate",
                  "fwd_loss_total", "fwd_loss_max", "bin_quarters", "bin_loss_total", "bin_loss_max"]
          def cell(v):
              try:
                  f = float(v)
              except ValueError:
                  return v
              return f"{f:,.3f}" if abs(f) < 10 and not f.is_integer() else f"{f:,.0f}"
          print("### Backtest summary (`backtest/out/summary.csv`)\n")
          print("| " + " | ".join(cols) + " |")
          print("|" + "---|" * len(cols))
          for r in rows:
              print("| " + " | ".join(cell(r[c]) for c in cols) + " |")
          print(f"\nCommit `{__import__('os').environ.get('GITHUB_SHA', '')[:7]}`. Parameters: `backtest/out/params.json`.")
          PY
          gh pr comment "$PR" --body-file summary.md --edit-last || gh pr comment "$PR" --body-file summary.md
