name: Dealer

# Every 15 minutes, five past the ingest: widen and restore forwards on new
# flags, list missing instruments, compute model mids and requote. X-Run-Id
# names the firing, so re-running a workflow attempt is reported by the
# route, not repeated.
on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the dealer job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}
          DEALER_URL: ${{ vars.DEALER_URL || 'https://openmarket.systems/api/cron/dealer' }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$REPOSITORY_IS_FORK" != "true" ]; then
              echo "::error::CRON_SECRET is not set; the scheduled job cannot run."
              exit 1
            fi
            echo "::warning::CRON_SECRET is not set; skipping this manual or fork run."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" -H "X-Run-Id: $RUN_ID" "$DEALER_URL"
