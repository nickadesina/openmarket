name: Dealer alerts

# Daily at 06:23 UTC, and on demand: fail if any instrument has been widened
# longer than the 72 h flag hold (params.json → dealer.flag_hours). A newer
# mid or the hold's end restores a widened forward, so one still widened past
# it means the dealer job has stopped running or keeps being re-flagged.
#
# The check reads the `health` block of the dealer job's own response: this
# workflow fires one extra dealer run under its own alerts- X-Run-Id (which
# cannot collide with vercel: slot IDs). Health excludes all alert probes from
# job freshness so this check cannot mask a stopped scheduler. It also fails
# when dealer success is older than 1 h, or settle/provenance older than 3 h.
#
# Deliberately not built here: the silent-source alert (a source with no
# success in 24 h) and the print-without-a-preceding-scoop counter. Both
# ship with ingest, owned by Nick (docs/decisions/0001), and read
# source_health and event_flags once ingest writes them.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  widened:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check widened instruments and scheduled job freshness
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}
          DEALER_URL: ${{ vars.DEALER_URL || 'https://openmarket.systems/api/cron/dealer' }}
          RUN_ID: alerts-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$REPOSITORY_IS_FORK" != "true" ]; then
              echo "::error::CRON_SECRET is not set; the scheduled job cannot run."
              exit 1
            fi
            echo "::warning::CRON_SECRET is not set; skipping this manual or fork run."
            exit 0
          fi
          body=$(curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" -H "X-Run-Id: $RUN_ID" "$DEALER_URL")
          status=$(echo "$body" | jq -r '.status')
          if [ "$status" != "succeeded" ]; then
            echo "::error::The dealer job did not run: status $status"
            echo "$body"
            exit 1
          fi
          hold=$(echo "$body" | jq -r '.health.widened_over_hold.hold_hours')
          count=$(echo "$body" | jq '.health.widened_over_hold.instruments | length')
          echo "Instruments widened longer than ${hold} h: ${count}"
          if [ "$count" -gt 0 ]; then
            echo "$body" | jq -r '.health.widened_over_hold.instruments[]
              | "::error::\(.company) \(.kind) widened since \(.widened_since) (\(.hours_widened | floor) h)"'
            exit 1
          fi
          # Fail closed if a deployment omits or malforms the freshness report.
          if ! echo "$body" | jq -e '
            .health.jobs as $jobs |
            ($jobs | type == "array") and
            ([$jobs[].job] | sort == ["dealer", "provenance", "settle"]) and
            all($jobs[]; .stale == false and (.last_succeeded_at | type == "string"))
          ' >/dev/null; then
            echo "::error::A scheduled job is stale, has never succeeded, or its health report is missing."
            echo "$body" | jq '.health.jobs'
            exit 1
          fi
