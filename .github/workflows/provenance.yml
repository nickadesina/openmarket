name: Tournament provenance

# Hourly: commit the last completed hour's forecast hashes and post the
# Merkle root as a Solana memo. The job catches up on any hours it missed,
# so a late or skipped run only delays posting.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the provenance job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}
          PROVENANCE_URL: ${{ vars.PROVENANCE_URL || 'https://openmarket.systems/api/t/cron/provenance' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$REPOSITORY_IS_FORK" != "true" ]; then
              echo "::error::CRON_SECRET is not set; the scheduled job cannot run."
              exit 1
            fi
            echo "::warning::CRON_SECRET is not set; skipping this manual or fork run."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$PROVENANCE_URL"
